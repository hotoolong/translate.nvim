name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, such as v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Reject a malformed or already used version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v1.2.3, got: $VERSION" >&2; exit 1 ;;
          esac
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists" >&2
            exit 1
          fi

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.10.0

      - run: make test

      - name: Tag the verified commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Publish the release
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --generate-notes --verify-tag
